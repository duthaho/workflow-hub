name: Agent Review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      provider:
        description: Review provider
        required: true
        type: choice
        options: [claude, codex]
      kind:
        description: Review kind
        required: true
        type: choice
        options: [correctness, security]

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  claude:
    if: vars.WORKFLOW_HUB_AI_REVIEW == 'enabled' && (vars.WORKFLOW_HUB_REVIEW_PROVIDER == 'claude' || inputs.provider == 'claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install trusted review tools
        run: |
          npm install --global github:duthaho/workflow-hub#v0.1.0
          npm install --global @anthropic-ai/claude-code@2.1.302
      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: workflow-hub review --provider claude --kind "${{ inputs.kind || 'correctness' }}" --base origin/main

  codex:
    if: vars.WORKFLOW_HUB_AI_REVIEW == 'enabled' && (vars.WORKFLOW_HUB_REVIEW_PROVIDER == 'codex' || inputs.provider == 'codex')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install trusted review tools
        run: |
          npm install --global github:duthaho/workflow-hub#v0.1.0
          npm install --global @openai/codex@0.163.0
      - name: Run Codex review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: workflow-hub review --provider codex --kind "${{ inputs.kind || 'correctness' }}" --base origin/main
