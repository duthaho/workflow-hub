name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag matching package.json, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify release identity and artifact
        run: |
          set -euo pipefail
          test "v$(node -p "require('./package.json').version")" = "${{ inputs.tag }}"
          npm ci --ignore-scripts
          npm run check
          npm pack --ignore-scripts
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$GITHUB_SHA" --title "workflow-hub $TAG" --generate-notes duthaho-workflow-hub-*.tgz
