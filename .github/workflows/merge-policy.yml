name: Merge Policy

on:
  workflow_run:
    workflows: [CI, CodeQL, Agent Review]
    types: [completed]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  evaluate:
    # workflow_run uses trusted default-branch code. It never checks out or executes PR code.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install trusted merge-policy runtime
        run: npm ci --ignore-scripts
      - name: Build trusted merge-policy runtime
        run: npm run build
      - name: Publish merge policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: >-
          node dist/cli.js github-merge-policy
          --repo "${{ github.repository }}"
          --pr "$PR_NUMBER"
